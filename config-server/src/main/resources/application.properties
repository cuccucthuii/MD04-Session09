spring.application.name=config-server

server.port=8888

# Backend native: cấu hình bài tập trong classpath:/config-data (ví dụ pharmacy-service.yml).
# Có thể chuyển sang Git bằng spring.cloud.config.server.git.uri + bỏ profile native.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/config-data