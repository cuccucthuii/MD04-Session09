spring.application.name=inventory-service

server.port=8082

spring.config.import=optional:configserver:http://localhost:8888

# PostgreSQL schema inventorydb
spring.datasource.url=jdbc:postgresql://localhost:5432/mic_session09db?currentSchema=inventorydb
spring.datasource.username=postgres
spring.datasource.password=000000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=inventorydb
spring.jpa.open-in-view=false

# Redis Cache Provider (Cache-aside), TTL cache "medicines" = 60 phút (RedisCacheConfig)
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
inventory.cache.medicines-ttl-minutes=60

# Redis Pub/Sub — thông báo Dashboard khi nhập hàng
inventory.redis.channel.pharmacy-alerts=pharmacy-alerts

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=inventory-stock-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest

inventory.kafka.topic.stock-events=medicine-stock-events

management.endpoints.web.exposure.include=health,info
