spring.application.name=inventory-service

spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers}
spring.kafka.consumer.group-id=inventory-stock-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest

inventory.kafka.topic.stock-events=medicine-stock-events

spring.datasource.url=jdbc:h2:mem:inventory_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
spring.cache.type=none
